version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    # A bun audit failure is usually a stale lockfile rather than a missing
    # pin in package.json "overrides": docs/dependency-overrides.md
    schedule:
      interval: 'weekly'
    # release-please reads these prefixes. A runtime bump changes what the
    # deployed Worker contains, so `fix` puts it in a release and gets it to
    # production; without a releasable type it would sit on main until an
    # unrelated change happened to cut a version. Development bumps change
    # only how the Worker is built and tested, so they stay out of releases.
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
    # Wait out the publish-then-pull window before proposing new versions.
    cooldown:
      default-days: 3
    groups:
      # Dependabot does not ship security updates for the bun ecosystem yet;
      # this group activates automatically once it does.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      # One combined weekly PR for all version bumps so interdependent
      # packages (vitest + pool-workers + vite + wrangler) move together.
      all-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
    ignore:
      # typescript-eslint declares a typescript peer range of >=4.8.4 <6.1.0.
      # On a TS 7 tree the lint run does not warn and continue, it throws
      # (`Cannot read properties of undefined (reading 'Cjs')`) and CI goes red.
      # A 6.1 minor also leaves the range, and is left to fail loudly rather
      # than pinning the whole minor line. Drop this once TS 7 is supported:
      # https://typescript-eslint.io/users/dependency-versions
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    rebase-strategy: 'auto'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    groups:
      all-actions:
        applies-to: version-updates
        patterns:
          - '*'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    rebase-strategy: 'auto'
