version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    # Security-patched transitive pins live in package.json "overrides". On each
    # grouped bump, recheck whether they can be dropped: docs/dependency-overrides.md
    schedule:
      interval: 'weekly'
    # Wait out the publish-then-pull window before proposing new versions.
    cooldown:
      default-days: 3
    groups:
      # Dependabot does not ship security updates for the bun ecosystem yet;
      # this group activates automatically once it does.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      # One combined weekly PR for all version bumps so interdependent
      # packages (vitest + pool-workers + vite + wrangler) move together.
      all-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
    ignore:
      # typescript-eslint declares a typescript peer range of >=4.8.4 <6.1.0.
      # On a TS 7 tree the lint run does not warn and continue, it throws
      # (`Cannot read properties of undefined (reading 'Cjs')`) and CI goes red.
      # A 6.1 minor also leaves the range, and is left to fail loudly rather
      # than pinning the whole minor line. Drop this once TS 7 is supported:
      # https://typescript-eslint.io/users/dependency-versions
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    rebase-strategy: 'auto'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    groups:
      all-actions:
        applies-to: version-updates
        patterns:
          - '*'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    rebase-strategy: 'auto'
